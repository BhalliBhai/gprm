<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GitHub Analytics - Step 3</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#11d452",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar for better mobile feel */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #326744;
            border-radius: 4px;
        }
        /* Toggle Switch Animation */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #11d452;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #11d452;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex justify-center">
<div class="w-full max-w-md bg-background-light dark:bg-background-dark flex flex-col relative overflow-hidden">
<!-- Background Pattern (Green Grid / Contribution Graph style) -->
<div class="absolute inset-0 opacity-5 pointer-events-none z-0 grid grid-cols-12 gap-1 content-start p-4">
<!-- Generating a grid pattern dynamically via HTML would be repetitive, using a repeated pattern instead -->
<div class="col-span-12 h-screen w-full" style="background-image: radial-gradient(#11d452 1px, transparent 1px); background-size: 20px 20px;"></div>
</div>
<!-- Header -->
<header class="flex items-center bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md p-4 sticky top-0 z-50 border-b border-primary/10">
<button class="text-slate-900 dark:text-white flex size-10 shrink-0 items-center justify-center hover:bg-primary/10 rounded-full transition-colors">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">GitHub Analytics</h2>
<button class="flex w-12 items-center justify-end group">
<span class="text-primary text-base font-bold leading-normal tracking-[0.015em] shrink-0 group-hover:opacity-80 transition-opacity">Next</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto pb-24 z-10 px-4">
<!-- Progress Indicator -->
<div class="flex w-full flex-row items-center justify-center gap-3 py-6">
<div class="h-2 w-2 rounded-full bg-primary/30"></div>
<div class="h-2 w-2 rounded-full bg-primary/30"></div>
<div class="h-2 w-2 rounded-full bg-primary ring-2 ring-primary/20"></div>
<div class="h-2 w-2 rounded-full bg-primary/30"></div>
<div class="h-2 w-2 rounded-full bg-primary/30"></div>
<div class="h-2 w-2 rounded-full bg-primary/30"></div>
</div>
<div class="space-y-6">
<!-- Title Section -->
<div class="space-y-2">
<h1 class="text-slate-900 dark:text-white tracking-tight text-3xl font-bold leading-tight">Showcase your stats</h1>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-relaxed">Choose which analytics to display on your profile. These will update automatically.</p>
</div>
<!-- Live Preview Section -->
<div class="bg-slate-100 dark:bg-[#1a2e21] border border-primary/10 rounded-xl p-4 shadow-sm relative overflow-hidden group">
<div class="absolute top-3 right-3 flex items-center gap-1 bg-primary/20 px-2 py-0.5 rounded text-xs text-primary font-medium">
<span class="material-symbols-outlined text-[14px]">visibility</span> Preview
                    </div>
<div class="mt-4 space-y-3">
<!-- Stat Card 1 -->
<div class="flex gap-3 bg-white dark:bg-[#0d1a12] p-3 rounded-lg border border-primary/5 items-center">
<div class="p-2 bg-primary/10 rounded-md text-primary">
<span class="material-symbols-outlined text-[20px]">commit</span>
</div>
<div>
<div class="text-xs text-slate-500 dark:text-slate-400">Total Commits (2023)</div>
<div class="text-lg font-bold text-slate-900 dark:text-white">1,248</div>
</div>
<div class="ml-auto">
<span class="text-primary text-xs font-bold">+12%</span>
</div>
</div>
<!-- Stat Card 2 (Languages) -->
<div class="bg-white dark:bg-[#0d1a12] p-3 rounded-lg border border-primary/5">
<div class="flex justify-between items-center mb-2">
<span class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase">Top Languages</span>
</div>
<div class="space-y-2">
<div class="flex items-center gap-2 text-xs">
<span class="w-16 text-slate-700 dark:text-slate-300">JavaScript</span>
<div class="flex-1 h-1.5 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
<div class="h-full bg-[#f1e05a] w-[65%]"></div>
</div>
<span class="text-slate-500">65%</span>
</div>
<div class="flex items-center gap-2 text-xs">
<span class="w-16 text-slate-700 dark:text-slate-300">HTML</span>
<div class="flex-1 h-1.5 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
<div class="h-full bg-[#e34c26] w-[25%]"></div>
</div>
<span class="text-slate-500">25%</span>
</div>
</div>
</div>
</div>
</div>
<!-- Configuration Toggles -->
<div class="space-y-4 pt-2">
<h3 class="text-slate-900 dark:text-white text-lg font-bold leading-tight">Stats Configuration</h3>
<!-- Toggle Item 1 -->
<label class="flex items-center justify-between p-4 bg-white dark:bg-[#1a2e21] rounded-xl border border-transparent hover:border-primary/20 transition-all cursor-pointer">
<div class="flex items-center gap-3">
<div class="bg-primary/10 p-2 rounded-lg text-primary">
<span class="material-symbols-outlined">data_usage</span>
</div>
<div class="flex flex-col">
<span class="font-semibold text-slate-900 dark:text-slate-100">Total Commits</span>
<span class="text-xs text-slate-500 dark:text-slate-400">Show aggregate commit count</span>
</div>
</div>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer border-slate-300 dark:border-slate-600 checked:right-0 checked:border-primary transition-all duration-300" name="toggle" type="checkbox"/>
<span class="toggle-label block overflow-hidden h-6 rounded-full bg-slate-300 dark:bg-slate-700 cursor-pointer transition-colors duration-300"></span>
</div>
</label>
<!-- Toggle Item 2 -->
<label class="flex items-center justify-between p-4 bg-white dark:bg-[#1a2e21] rounded-xl border border-transparent hover:border-primary/20 transition-all cursor-pointer">
<div class="flex items-center gap-3">
<div class="bg-orange-500/10 p-2 rounded-lg text-orange-500">
<span class="material-symbols-outlined">local_fire_department</span>
</div>
<div class="flex flex-col">
<span class="font-semibold text-slate-900 dark:text-slate-100">Current Streak</span>
<span class="text-xs text-slate-500 dark:text-slate-400">Display consecutive contribution days</span>
</div>
</div>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer border-slate-300 dark:border-slate-600 checked:right-0 checked:border-primary transition-all duration-300" name="toggle" type="checkbox"/>
<span class="toggle-label block overflow-hidden h-6 rounded-full bg-slate-300 dark:bg-slate-700 cursor-pointer transition-colors duration-300"></span>
</div>
</label>
<!-- Toggle Item 3 -->
<label class="flex items-center justify-between p-4 bg-white dark:bg-[#1a2e21] rounded-xl border border-transparent hover:border-primary/20 transition-all cursor-pointer">
<div class="flex items-center gap-3">
<div class="bg-blue-500/10 p-2 rounded-lg text-blue-500">
<span class="material-symbols-outlined">code</span>
</div>
<div class="flex flex-col">
<span class="font-semibold text-slate-900 dark:text-slate-100">Top Languages</span>
<span class="text-xs text-slate-500 dark:text-slate-400">Bar chart of used languages</span>
</div>
</div>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer border-slate-300 dark:border-slate-600 checked:right-0 checked:border-primary transition-all duration-300" name="toggle" type="checkbox"/>
<span class="toggle-label block overflow-hidden h-6 rounded-full bg-slate-300 dark:bg-slate-700 cursor-pointer transition-colors duration-300"></span>
</div>
</label>
<!-- Toggle Item 4 -->
<label class="flex items-center justify-between p-4 bg-white dark:bg-[#1a2e21] rounded-xl border border-transparent hover:border-primary/20 transition-all cursor-pointer">
<div class="flex items-center gap-3">
<div class="bg-yellow-500/10 p-2 rounded-lg text-yellow-500">
<span class="material-symbols-outlined">emoji_events</span>
</div>
<div class="flex flex-col">
<span class="font-semibold text-slate-900 dark:text-slate-100">GitHub Trophies</span>
<span class="text-xs text-slate-500 dark:text-slate-400">Showcase your achievements</span>
</div>
</div>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer border-slate-300 dark:border-slate-600 checked:right-0 checked:border-primary transition-all duration-300" name="toggle" type="checkbox"/>
<span class="toggle-label block overflow-hidden h-6 rounded-full bg-slate-300 dark:bg-slate-700 cursor-pointer transition-colors duration-300"></span>
</div>
</label>
</div>
</div>
</main>
<!-- Bottom Action Bar (Simulated Mobile Tab Bar or Action Area) -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-xl border-t border-primary/10 z-50 flex justify-center">
<button class="w-full max-w-md bg-primary text-slate-900 font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-primary/20 hover:bg-primary/90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span>Continue to Socials</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
</body></html>
