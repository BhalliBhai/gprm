<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Profile Generator - Step 1</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#11d452",
                        "background-light": "#f6f8f6",
                        "background-dark": "#0d1117", /* GitHub dark bg approximate */
                        "surface-dark": "#161b22", /* GitHub surface dark */
                        "border-dark": "#30363d", /* GitHub border dark */
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col antialiased selection:bg-primary/30 selection:text-primary">
<!-- Top App Bar -->
<div class="sticky top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-gray-200 dark:border-border-dark">
<div class="flex items-center px-4 h-16 justify-between max-w-md mx-auto w-full">
<button class="text-slate-900 dark:text-slate-100 flex items-center justify-center p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-slate-900 dark:text-slate-100 text-lg font-bold tracking-tight">Profile Generator</h1>
<button class="text-primary text-sm font-bold uppercase tracking-wider hover:text-primary/80 transition-colors">
                Help
            </button>
</div>
<!-- Progress Stepper -->
<div class="w-full max-w-md mx-auto px-6 pb-4">
<div class="flex items-center justify-between relative">
<!-- Line background -->
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-0.5 bg-gray-200 dark:bg-border-dark -z-10"></div>
<!-- Step 1 (Active) -->
<div class="flex flex-col items-center gap-1">
<div class="h-8 w-8 rounded-full bg-primary flex items-center justify-center ring-4 ring-background-light dark:ring-background-dark">
<span class="material-symbols-outlined text-background-dark text-[18px] font-bold">person</span>
</div>
</div>
<!-- Step 2 -->
<div class="flex flex-col items-center gap-1">
<div class="h-8 w-8 rounded-full bg-gray-200 dark:bg-surface-dark border-2 border-gray-300 dark:border-border-dark flex items-center justify-center ring-4 ring-background-light dark:ring-background-dark">
<span class="material-symbols-outlined text-gray-400 dark:text-gray-500 text-[18px]">code</span>
</div>
</div>
<!-- Step 3 -->
<div class="flex flex-col items-center gap-1">
<div class="h-8 w-8 rounded-full bg-gray-200 dark:bg-surface-dark border-2 border-gray-300 dark:border-border-dark flex items-center justify-center ring-4 ring-background-light dark:ring-background-dark">
<span class="material-symbols-outlined text-gray-400 dark:text-gray-500 text-[18px]">share</span>
</div>
</div>
<!-- Step 4 -->
<div class="flex flex-col items-center gap-1">
<div class="h-8 w-8 rounded-full bg-gray-200 dark:bg-surface-dark border-2 border-gray-300 dark:border-border-dark flex items-center justify-center ring-4 ring-background-light dark:ring-background-dark">
<span class="material-symbols-outlined text-gray-400 dark:text-gray-500 text-[18px]">check</span>
</div>
</div>
</div>
<div class="flex justify-between mt-2 text-[10px] font-medium uppercase tracking-wider text-gray-400 dark:text-gray-500">
<span class="text-primary">Basic</span>
<span>Tech</span>
<span>Socials</span>
<span>Done</span>
</div>
</div>
</div>
<!-- Main Content -->
<main class="flex-1 w-full max-w-md mx-auto px-4 py-6 pb-24">
<header class="mb-8">
<h2 class="text-3xl font-bold text-slate-900 dark:text-slate-100 mb-2">Basic Information</h2>
<p class="text-slate-600 dark:text-gray-400 text-base leading-relaxed">
                Let's start with your introduction. This content will appear at the very top of your README.
            </p>
</header>
<form class="space-y-6">
<!-- Name Field -->
<div class="space-y-2">
<label class="block text-sm font-medium text-slate-700 dark:text-gray-300" for="full-name">
                    Display Name
                </label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-gray-400 dark:text-gray-500 group-focus-within:text-primary transition-colors">badge</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 bg-white dark:bg-surface-dark border border-gray-300 dark:border-border-dark rounded-lg text-slate-900 dark:text-slate-100 placeholder-gray-400 dark:placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all shadow-sm" id="full-name" placeholder="e.g. Mona Lisa" type="text"/>
</div>
</div>
<!-- Role Field -->
<div class="space-y-2">
<label class="block text-sm font-medium text-slate-700 dark:text-gray-300" for="role">
                    Primary Role / Title
                </label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-gray-400 dark:text-gray-500 group-focus-within:text-primary transition-colors">work</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 bg-white dark:bg-surface-dark border border-gray-300 dark:border-border-dark rounded-lg text-slate-900 dark:text-slate-100 placeholder-gray-400 dark:placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all shadow-sm" id="role" placeholder="e.g. Full Stack Developer" type="text"/>
</div>
</div>
<!-- About Me (Markdown) -->
<div class="space-y-2">
<div class="flex justify-between items-end">
<label class="block text-sm font-medium text-slate-700 dark:text-gray-300" for="about">
                        About Me
                    </label>
<span class="text-xs text-primary bg-primary/10 px-2 py-0.5 rounded-full font-medium">Markdown Supported</span>
</div>
<div class="bg-white dark:bg-surface-dark border border-gray-300 dark:border-border-dark rounded-lg overflow-hidden focus-within:ring-2 focus-within:ring-primary/50 focus-within:border-primary transition-all shadow-sm group">
<!-- Toolbar -->
<div class="flex items-center gap-1 p-2 border-b border-gray-200 dark:border-border-dark bg-gray-50 dark:bg-[#0d1117]">
<button class="p-1.5 rounded hover:bg-gray-200 dark:hover:bg-gray-800 text-gray-500 dark:text-gray-400 transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">format_bold</span>
</button>
<button class="p-1.5 rounded hover:bg-gray-200 dark:hover:bg-gray-800 text-gray-500 dark:text-gray-400 transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">format_italic</span>
</button>
<button class="p-1.5 rounded hover:bg-gray-200 dark:hover:bg-gray-800 text-gray-500 dark:text-gray-400 transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">link</span>
</button>
<div class="w-px h-4 bg-gray-300 dark:bg-border-dark mx-1"></div>
<button class="p-1.5 rounded hover:bg-gray-200 dark:hover:bg-gray-800 text-gray-500 dark:text-gray-400 transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">code</span>
</button>
</div>
<textarea class="block w-full p-3 bg-transparent border-none text-slate-900 dark:text-slate-100 placeholder-gray-400 dark:placeholder-gray-600 focus:ring-0 resize-none text-sm leading-relaxed" id="about" placeholder="I'm a passionate developer building things for the web..." rows="5"></textarea>
</div>
<p class="text-xs text-gray-500 dark:text-gray-500 text-right">0/500 characters</p>
</div>
<!-- Portfolio Link -->
<div class="space-y-2">
<label class="block text-sm font-medium text-slate-700 dark:text-gray-300" for="portfolio">
                    Portfolio / Website
                </label>
<div class="flex rounded-lg shadow-sm border border-gray-300 dark:border-border-dark bg-white dark:bg-surface-dark overflow-hidden focus-within:ring-2 focus-within:ring-primary/50 focus-within:border-primary transition-all">
<span class="inline-flex items-center px-3 rounded-l-md border-r border-gray-300 dark:border-border-dark bg-gray-50 dark:bg-[#0d1117] text-gray-500 dark:text-gray-400 text-sm">
                        https://
                    </span>
<input class="block w-full flex-1 border-none bg-transparent py-3 pl-3 text-slate-900 dark:text-slate-100 placeholder-gray-400 dark:placeholder-gray-600 focus:ring-0 sm:text-sm" id="portfolio" placeholder="www.yourportfolio.com" type="text"/>
</div>
</div>
<!-- Template Selection (Mini) -->
<div class="pt-2">
<label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-3">
                    Choose a Style Accent
                </label>
<div class="grid grid-cols-4 gap-3">
<label class="cursor-pointer group relative">
<input checked="" class="peer sr-only" name="accent" type="radio"/>
<div class="h-10 w-full rounded-lg bg-[#11d452] ring-2 ring-offset-2 ring-offset-background-light dark:ring-offset-background-dark ring-transparent peer-checked:ring-[#11d452] transition-all"></div>
<div class="absolute inset-0 flex items-center justify-center opacity-0 peer-checked:opacity-100">
<span class="material-symbols-outlined text-black font-bold text-sm">check</span>
</div>
</label>
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="accent" type="radio"/>
<div class="h-10 w-full rounded-lg bg-[#79c0ff] ring-2 ring-offset-2 ring-offset-background-light dark:ring-offset-background-dark ring-transparent peer-checked:ring-[#79c0ff] transition-all"></div>
<div class="absolute inset-0 flex items-center justify-center opacity-0 peer-checked:opacity-100">
<span class="material-symbols-outlined text-black font-bold text-sm">check</span>
</div>
</label>
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="accent" type="radio"/>
<div class="h-10 w-full rounded-lg bg-[#d2a8ff] ring-2 ring-offset-2 ring-offset-background-light dark:ring-offset-background-dark ring-transparent peer-checked:ring-[#d2a8ff] transition-all"></div>
<div class="absolute inset-0 flex items-center justify-center opacity-0 peer-checked:opacity-100">
<span class="material-symbols-outlined text-black font-bold text-sm">check</span>
</div>
</label>
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="accent" type="radio"/>
<div class="h-10 w-full rounded-lg bg-[#ff7b72] ring-2 ring-offset-2 ring-offset-background-light dark:ring-offset-background-dark ring-transparent peer-checked:ring-[#ff7b72] transition-all"></div>
<div class="absolute inset-0 flex items-center justify-center opacity-0 peer-checked:opacity-100">
<span class="material-symbols-outlined text-black font-bold text-sm">check</span>
</div>
</label>
</div>
</div>
</form>
</main>
<!-- Bottom Navigation -->
<div class="fixed bottom-0 w-full max-w-md left-1/2 -translate-x-1/2 bg-background-light dark:bg-background-dark border-t border-gray-200 dark:border-border-dark p-4 pb-6 z-40">
<div class="flex gap-4">
<button class="flex-1 py-3.5 px-6 rounded-xl border border-gray-300 dark:border-border-dark text-slate-700 dark:text-slate-300 font-bold text-sm hover:bg-gray-100 dark:hover:bg-surface-dark transition-all">
                Reset
            </button>
<button class="flex-[2] py-3.5 px-6 rounded-xl bg-primary text-background-dark font-bold text-sm hover:bg-primary/90 transition-all flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(17,212,82,0.4)]">
                Next Step
                <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
</div>
</body></html>
